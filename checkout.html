<!DOCTYPE html>
<html>

<head>

<title>Checkout - Cyprus King Enterprises</title>

<link rel="stylesheet" href="style.css">

</head>


<body>


<nav>

<div class="logo">

<img src="logo.png">

<h2>Cyprus King</h2>

</div>


<div class="menu">

<a href="cart.html">
Back To Cart
</a>

</div>


</nav>





<section class="checkout-page">


<h1>
Complete Your Order
</h1>



<div class="checkout-container">



<div class="checkout-products">


<h2>
Order Summary
</h2>



<div id="checkout-items">

</div>



<h2 id="checkout-total">

</h2>



</div>





<div class="checkout-form-box">


<h2>
Customer Information
</h2>



<form id="checkout-form">



<input

type="text"

id="customer-name"

placeholder="Full Name"

required

>



<input

type="text"

id="customer-phone"

placeholder="Phone Number"

required

>




<textarea

id="customer-address"

placeholder="Delivery Address"

required>

</textarea>




<h3>
Payment Method
</h3>



<label>

<input type="radio" name="payment" checked>

Cash On Delivery

</label>


<br>


<label>

<input type="radio" name="payment">

Bank Transfer

</label>




<br><br>




<button type="submit">

Place Order 🛒

</button>



</form>



</div>



</div>



</section>





<script src="script.js"></script>


</body>

</html>
