<!DOCTYPE html>
<html>

<head>

<title>Admin Dashboard - Cyprus King Enterprises</title>

<link rel="stylesheet" href="style.css">

</head>


<body>


<nav>

<h2>
Cyprus King Admin
</h2>


<a href="index.html">
View Store
</a>


<button onclick="adminLogout()">

Logout

</button>


</nav>




<div class="admin-header">

<h1>
Cyprus King Admin Dashboard
</h1>

<p>
Manage products, update inventory and control your store.
</p>


<div class="stats-box">

<div>
<h2 id="total-products">
0
</h2>

<p>
Products
</p>
</div>


<div>
<h2>
📦
</h2>

<p>
Orders
</p>
</div>


<div>
<h2>
💰
</h2>

<p>
Sales
</p>
</div>


</div>


</div>



<div class="admin-box">


<input 
id="product-name"
placeholder="Product Name"
>


<input 
id="product-price"
placeholder="Product Price"
type="number"
>


<input 
id="product-category"
placeholder="Category"
>


<input 
type="file"
id="product-image"
accept="image/*"
>


<img 
id="image-preview"
style="width:120px; margin-top:10px;"
>



<button onclick="addNewProduct()">

Add Product

</button>


</div>





<div id="edit-box" style="display:none;">


<h2>
Edit Product
</h2>


<input id="edit-name" placeholder="Product Name">

<br><br>

<input id="edit-price" type="number" placeholder="Product Price">

<br><br>

<input id="edit-category" placeholder="Category">

<br><br>

<input 
type="file"
id="edit-image"
accept="image/*"
>


<img 
id="edit-image-preview"
style="width:120px;margin-top:10px;"
>
<br><br>

<textarea id="edit-description" placeholder="Description"></textarea>

<br><br>


<button onclick="saveEditedProduct()">

Save Changes

</button>



<button onclick="closeEditBox()">

Cancel

</button>


</div>





<h2>
Products List
</h2>

<h2>
Customer Orders
</h2>


<div id="admin-orders">

</div>

<div id="admin-products">

</div>





<script src="script.js"></script>




<script>

if(
localStorage.getItem("adminLogin") !== "true"
){

window.location.href="login.html";

}

let editingIndex = null;




window.onload = function(){

loadAdminProducts();

loadAdminOrders();

};





function loadAdminProducts(){


let box =
document.getElementById("admin-products");



let products =
JSON.parse(localStorage.getItem("products"))
|| [];



box.innerHTML = "";



if(products.length === 0){

box.innerHTML =
"<h3>No products found</h3>";

return;

}




products.forEach(function(product,index){



box.innerHTML += `


<div class="product-card">


<img src="${product.image}">


<h3>
${product.name}
</h3>



<p>
${product.category}
</p>



<h4>
$${product.price}
</h4>



<p>
${product.description || ""}
</p>



<button onclick="openAdminProduct(${index})">

View Product

</button>



<button onclick="editAdminProduct(${index})">

Edit

</button>



<button onclick="deleteAdminProduct(${index})">

Delete

</button>



</div>


`;



});


}






function openAdminProduct(index){


let products =
JSON.parse(localStorage.getItem("products"))
|| [];



let product =
products[index];



localStorage.setItem("productName",product.name);

localStorage.setItem("productPrice",product.price);

localStorage.setItem("productCategory",product.category);

localStorage.setItem("productImage",product.image);

localStorage.setItem("productDescription",product.description || "");



window.location.href="product.html";


}






function editAdminProduct(index){


let products =
JSON.parse(localStorage.getItem("products"))
|| [];



let product =
products[index];



editingIndex = index;



document.getElementById("edit-box").style.display="block";


document.getElementById("edit-name").value =
product.name;


document.getElementById("edit-price").value =
product.price;


document.getElementById("edit-category").value =
product.category;


document.getElementById("edit-image").value =
product.image;


document.getElementById("edit-description").value =
product.description || "";



window.scrollTo(0,0);


}






function saveEditedProduct(){


let products =
JSON.parse(localStorage.getItem("products"))
|| [];


let oldProduct =
products[editingIndex];


let imageFile =
document.getElementById("edit-image").files[0];



if(imageFile){


let reader = new FileReader();



reader.onload = function(e){


products[editingIndex]={


name:
document.getElementById("edit-name").value,


price:
Number(document.getElementById("edit-price").value),


category:
document.getElementById("edit-category").value,


image:
e.target.result,


description:
document.getElementById("edit-description").value


};



localStorage.setItem(
"products",
JSON.stringify(products)
);



alert("Product Updated Successfully");


location.reload();


};



reader.readAsDataURL(imageFile);



}

else{


products[editingIndex]={


name:
document.getElementById("edit-name").value,


price:
Number(document.getElementById("edit-price").value),


category:
document.getElementById("edit-category").value,


image:
oldProduct.image,


description:
document.getElementById("edit-description").value


};



localStorage.setItem(
"products",
JSON.stringify(products)
);



alert("Product Updated Successfully");


location.reload();


}



}





function deleteAdminProduct(index){


let products =
JSON.parse(localStorage.getItem("products"))
|| [];



products.splice(index,1);



localStorage.setItem(
"products",
JSON.stringify(products)
);



location.reload();


}





function closeEditBox(){


document.getElementById("edit-box").style.display="none";


}

document.getElementById("product-image").onchange = function(e){


let file = e.target.files[0];


if(file){


let reader = new FileReader();



reader.onload = function(event){


document.getElementById("image-preview").src =
event.target.result;


};


reader.readAsDataURL(file);


}


};

function loadAdminOrders(){


let orderBox =
document.getElementById("admin-orders");



if(!orderBox){

return;

}



let orders =
JSON.parse(localStorage.getItem("orders"))
|| [];



orderBox.innerHTML = "";



if(orders.length === 0){


orderBox.innerHTML =
"<h3>No orders yet</h3>";


return;


}




orders.forEach(function(order,index){



let productsText = "";



order.products.forEach(function(item){


productsText +=
item.name +
" x" +
item.quantity +
"<br>";



});




orderBox.innerHTML += `


<div class="product-card">


<h3>
Order #${index + 1}
</h3>


<p>
Customer: ${order.customerName}
</p>


<p>
Phone: ${order.phone}
</p>


<p>
Address: ${order.address}
</p>


<p>
Products:
<br>
${productsText}
</p>


<h4>
Total: $${order.total}
</h4>

<p>
Status:
</p>


<select onchange="changeOrderStatus(${index}, this.value)">

<br><br>

<button onclick="deleteOrder(${index})">

Delete Order

</button>

<option ${order.status=="Pending" ? "selected":""}>
Pending
</option>


<option ${order.status=="Processing" ? "selected":""}>
Processing
</option>


<option ${order.status=="Completed" ? "selected":""}>
Completed
</option>


<option ${order.status=="Cancelled" ? "selected":""}>
Cancelled
</option>


</select>



<p>
Date: ${order.date}
</p>


<button onclick="deleteOrder(${index})">

🗑 Delete Order

</button>


</div>


`;



});


}

function changeOrderStatus(index,status){


let orders =
JSON.parse(localStorage.getItem("orders"))
|| [];



orders[index].status = status;



localStorage.setItem(
"orders",
JSON.stringify(orders)
);



location.reload();


}

function deleteOrder(index){


let orders =
JSON.parse(localStorage.getItem("orders"))
|| [];



let confirmDelete =
confirm("Delete this order?");



if(confirmDelete){


orders.splice(index,1);



localStorage.setItem(
"orders",
JSON.stringify(orders)
);



location.reload();


}


}

function deleteOrder(index){


let orders =
JSON.parse(localStorage.getItem("orders"))
|| [];



if(confirm("Are you sure you want to delete this order?")){


orders.splice(index,1);



localStorage.setItem(
"orders",
JSON.stringify(orders)
);



location.reload();


}


}

</script>



</body>

</html>
